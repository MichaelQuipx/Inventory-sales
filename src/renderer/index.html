<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KJ STORE | Inventory & Sales</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">KJ</span><span>KJ STORE</span></div>
      <p class="store-label">INVENTORY &amp; SALES</p>
      <nav aria-label="Main navigation">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">&#9638;</span><span class="nav-label">Dashboard</span></button>
        <button class="nav-item" data-page="sale"><span class="nav-icon">&#43;</span><span class="nav-label">Record Sale</span></button>
        <button class="nav-item" data-page="inventory"><span class="nav-icon">&#9776;</span><span class="nav-label">Inventory</span></button>
        <button class="nav-item" data-page="history"><span class="nav-icon">&#9681;</span><span class="nav-label">History</span></button>
        <button class="nav-item" data-page="users" data-role="super-admin"><span class="nav-icon">&#9782;</span><span class="nav-label">User Management</span></button>
      </nav>
      <div id="session-panel" class="session-panel"></div>
    </aside>
    <main id="app" aria-live="polite"></main>
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="assertive"></div>
    <script src="renderer.js"></script>
  </body>
</html>
